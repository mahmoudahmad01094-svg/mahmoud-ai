<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      window.process = { env: {} };
    </script>
    <script>
      window.addEventListener('error', function(event) {
        var msg = 'Global Error: ' + (event.error ? event.error.stack : event.message);
        console.error(msg);
        if (document.body) {
          document.body.innerHTML += '<div style="color:red; padding:20px; background:#222; z-index:9999; position:absolute; top:0; left:0; right:0;"><h3>Global Error:</h3><pre>' + msg + '</pre></div>';
        } else {
          window.onload = function() {
            document.body.innerHTML += '<div style="color:red; padding:20px; background:#222; z-index:9999; position:absolute; top:0; left:0; right:0;"><h3>Global Error:</h3><pre>' + msg + '</pre></div>';
          };
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var msg = 'Unhandled Promise Rejection: ' + (event.reason ? event.reason.stack : event.reason);
        console.error(msg);
        if (document.body) {
          document.body.innerHTML += '<div style="color:red; padding:20px; background:#222; z-index:9999; position:absolute; top:0; left:0; right:0;"><h3>Unhandled Promise Rejection:</h3><pre>' + msg + '</pre></div>';
        } else {
          window.onload = function() {
            document.body.innerHTML += '<div style="color:red; padding:20px; background:#222; z-index:9999; position:absolute; top:0; left:0; right:0;"><h3>Unhandled Promise Rejection:</h3><pre>' + msg + '</pre></div>';
          };
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
