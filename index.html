<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محمودAi</title>
    <script>
      window.process = window.process || { env: {} };
      window.onerror = function(message, source, lineno, colno, error) {
        var errorDiv = document.createElement('div');
        errorDiv.style.color = 'red';
        errorDiv.style.padding = '20px';
        errorDiv.style.fontFamily = 'sans-serif';
        errorDiv.innerHTML = '<h3>Application Error</h3>' +
          '<p><strong>Message:</strong> ' + message + '</p>' +
          '<p><strong>Source:</strong> ' + source + ':' + lineno + ':' + colno + '</p>' +
          '<pre>' + (error && error.stack ? error.stack : '') + '</pre>';
        document.body.appendChild(errorDiv);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.color = 'red';
        errorDiv.style.padding = '20px';
        errorDiv.style.fontFamily = 'sans-serif';
        errorDiv.innerHTML = '<h3>Unhandled Promise Rejection</h3>' +
          '<p><strong>Reason:</strong> ' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '</p>' +
          '<pre>' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre>';
        document.body.appendChild(errorDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
